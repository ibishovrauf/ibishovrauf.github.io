  # ─── About ─────────────────────────────────────────────────────────────────
  about:
    enable: true
    title: "About Me"
    image: "/images/me.png"
    content: |-
      I'm an ML Engineer with three years of production NLP experience, joining TUM's MSc in Information Engineering in 2025.

      My work centers on two problems: making search relevant and making models fast. At NAIC (National AI Center) I built a hybrid retrieval pipeline — BM25 for exact-match recall and SBERT/DPR for semantic coverage — over a 500k-document domain corpus. Evaluated against MRR@10, NDCG@5, and precision-recall curves; user testing put accuracy at 85%.

      On the efficiency side: I exported DistilBERT and SBERT to ONNX, combined dynamic quantization with mixed-precision training, and reduced model size by **39%** with under 1% accuracy loss. The same pipeline handles query-time NER and query classification.

      I track numbers. If I can't measure it, I don't claim it improved.

      **What I build:**

      - Build hybrid retrieval pipelines combining BM25 with SBERT/DPR dense vectors — evaluated against MRR@10 and NDCG@5 across 500k+ document corpora.
      - Design and benchmark re-ranking stages using cross-encoder LLMs and lightweight re-ranking models, trading precision against P95 latency at each stage.
      - Export Transformer models (DistilBERT, SBERT) to ONNX and apply dynamic INT8 quantization — 39% size reduction, under 1% accuracy loss.
      - Apply mixed-precision training (torch.cuda.amp) to cut fine-tuning wall-clock time ~1.8× without benchmark regression.
      - Implement query understanding with quantized DistilBERT — NER and classification in a single inference pass — deployed on AWS.
      - Define evaluation frameworks (MRR@10, NDCG@5, precision-recall) before building models, so every optimization is grounded in measurable outcomes.
    skills:
      enable: true
      title: "Core stack:"
      items:
        - "Python · PyTorch · Hugging Face Transformers"
        - "ONNX · Dynamic Quantization · Mixed Precision"
        - "BM25 · SBERT · DPR · Cross-Encoders"
        - "Elasticsearch · FAISS · Qdrant"
        - "FastAPI · Docker · AWS"
        - "MRR · NDCG · Precision-Recall"

