<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" font-family="Segoe UI, Roboto, -apple-system, sans-serif">
  <defs>
    <style>
      :root { --light-bg: #f8f9fa; --dark-bg: #1a1a1a; }

      /* Light mode (default) */
      .bg-light { background: white; }
      .title { font-size: 24px; font-weight: 700; fill: #0d1117; }
      .subtitle { font-size: 13px; fill: #57606a; }
      .box-text { font-size: 14px; font-weight: 600; fill: #0d1117; }
      .box-detail { font-size: 12px; fill: #57606a; }

      /* Dark mode */
      @media (prefers-color-scheme: dark) {
        .title { fill: #e6edf3; }
        .subtitle, .box-detail { fill: #8b949e; }
        .box-text { fill: #e6edf3; }
      }

      /* Box colors - light mode */
      .box-blue { fill: #cffafe; stroke: #06b6d4; }
      .box-yellow { fill: #fef3c7; stroke: #f59e0b; }
      .box-green { fill: #d1fae5; stroke: #10b981; }
      .box-purple { fill: #e9d5ff; stroke: #a855f7; }
      .box-cyan { fill: #cffafe; stroke: #06b6d4; }

      /* Box colors - dark mode */
      @media (prefers-color-scheme: dark) {
        .box-blue { fill: #0d47a1; stroke: #42a5f5; }
        .box-yellow { fill: #bf360c; stroke: #ff9800; }
        .box-green { fill: #1b5e20; stroke: #66bb6a; }
        .box-purple { fill: #4a148c; stroke: #ce93d8; }
        .box-cyan { fill: #006064; stroke: #4dd0e1; }
      }

      .line { stroke: #57606a; stroke-width: 2; fill: none; }
      @media (prefers-color-scheme: dark) {
        .line { stroke: #30363d; }
      }

      .arrow { stroke: #57606a; stroke-width: 2.5; fill: none; }
      @media (prefers-color-scheme: dark) {
        .arrow { stroke: #8b949e; }
      }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#57606a"/>
    </marker>
    <marker id="arrowhead-dark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" class="title">Tokenizer Training Pipeline</text>
  <text x="600" y="55" text-anchor="middle" class="subtitle">MongoDB streaming • multiprocessing • bulk_write</text>

  <!-- PREPROCESSING STAGE -->
  <!-- Raw Corpus -->
  <rect x="30" y="90" width="140" height="120" rx="8" class="box-blue" stroke-width="2"/>
  <text x="100" y="130" text-anchor="middle" class="box-text">Raw Corpus</text>
  <text x="100" y="150" text-anchor="middle" class="box-detail">~100–150 GB</text>
  <text x="100" y="165" text-anchor="middle" class="box-detail">10 collections</text>
  <text x="100" y="180" text-anchor="middle" class="box-detail">95.7B chars</text>

  <!-- Arrow 1 -->
  <line x1="170" y1="150" x2="210" y2="150" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Entity Sanitization -->
  <rect x="210" y="90" width="140" height="120" rx="8" class="box-yellow" stroke-width="2"/>
  <text x="280" y="125" text-anchor="middle" class="box-text">Entity</text>
  <text x="280" y="143" text-anchor="middle" class="box-text">Sanitization</text>
  <text x="280" y="163" text-anchor="middle" class="box-detail">URL → [URL]</text>
  <text x="280" y="177" text-anchor="middle" class="box-detail">EMAIL, PHONE</text>

  <!-- Arrow 2 -->
  <line x1="350" y1="150" x2="390" y2="150" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Emoji Normalization -->
  <rect x="390" y="90" width="140" height="120" rx="8" class="box-yellow" stroke-width="2"/>
  <text x="460" y="125" text-anchor="middle" class="box-text">Emoji</text>
  <text x="460" y="143" text-anchor="middle" class="box-text">Normalization</text>
  <text x="460" y="163" text-anchor="middle" class="box-detail">all → [EMOJI]</text>
  <text x="460" y="177" text-anchor="middle" class="box-detail">−0.215 fertility</text>

  <!-- Arrow 3 -->
  <line x1="530" y1="150" x2="570" y2="150" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Punctuation Normalization -->
  <rect x="570" y="90" width="140" height="120" rx="8" class="box-yellow" stroke-width="2"/>
  <text x="640" y="125" text-anchor="middle" class="box-text">Punctuation</text>
  <text x="640" y="143" text-anchor="middle" class="box-text">Normalization</text>
  <text x="640" y="163" text-anchor="middle" class="box-detail">"smart" → ASCII</text>
  <text x="640" y="177" text-anchor="middle" class="box-detail">NFKC ready</text>

  <!-- Arrow 4 -->
  <line x1="710" y1="150" x2="750" y2="150" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Character Statistics -->
  <rect x="750" y="90" width="140" height="120" rx="8" class="box-green" stroke-width="2"/>
  <text x="820" y="125" text-anchor="middle" class="box-text">Character</text>
  <text x="820" y="143" text-anchor="middle" class="box-text">Statistics</text>
  <text x="820" y="163" text-anchor="middle" class="box-detail">char_stats.json</text>
  <text x="820" y="177" text-anchor="middle" class="box-detail">drives alphabet</text>

  <!-- Arrow down -->
  <path d="M 820 210 L 820 250" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Sampling -->
  <rect x="710" y="250" width="220" height="110" rx="8" class="box-purple" stroke-width="2"/>
  <text x="820" y="285" text-anchor="middle" class="box-text">Sampling</text>
  <text x="820" y="305" text-anchor="middle" class="box-detail">per-collection rates</text>
  <text x="820" y="320" text-anchor="middle" class="box-detail">1.55M documents</text>

  <!-- Arrow from character stats to sampling -->
  <path d="M 750 250 Q 600 300 710 305" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- TRAINING STAGE -->
  <!-- SPM Unigram -->
  <rect x="60" y="400" width="150" height="110" rx="8" class="box-yellow" stroke-width="2"/>
  <text x="135" y="430" text-anchor="middle" class="box-text">SPM Unigram</text>
  <text x="135" y="450" text-anchor="middle" class="box-detail">Cased + Uncased</text>
  <text x="135" y="470" text-anchor="middle" class="box-detail">1.838–1.932</text>

  <!-- SPM BPE -->
  <rect x="270" y="400" width="150" height="110" rx="8" class="box-yellow" stroke-width="2"/>
  <text x="345" y="430" text-anchor="middle" class="box-text">SPM BPE</text>
  <text x="345" y="450" text-anchor="middle" class="box-detail">Cased + Uncased</text>
  <text x="345" y="470" text-anchor="middle" class="box-detail">1.845–1.932</text>

  <!-- WordPiece -->
  <rect x="480" y="400" width="150" height="110" rx="8" class="box-cyan" stroke-width="2"/>
  <text x="555" y="430" text-anchor="middle" class="box-text">WordPiece</text>
  <text x="555" y="450" text-anchor="middle" class="box-detail">Cased + Uncased</text>
  <text x="555" y="470" text-anchor="middle" class="box-detail">1.727–1.833</text>

  <!-- Arrows from sampling to algorithms -->
  <path d="M 760 360 L 135 400" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 800 360 L 345 400" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 840 360 L 555 400" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Evaluation & Selection -->
  <rect x="720" y="400" width="180" height="110" rx="8" class="box-green" stroke-width="2"/>
  <text x="810" y="425" text-anchor="middle" class="box-text">Evaluation &</text>
  <text x="810" y="443" text-anchor="middle" class="box-text">Selection</text>
  <text x="810" y="465" text-anchor="middle" class="box-detail">47,934 samples</text>
  <text x="810" y="480" text-anchor="middle" class="box-detail">→ wp_2_uncased</text>

  <!-- Arrow from algorithms to evaluation -->
  <line x1="630" y1="455" x2="720" y2="455" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Selected Tokenizer (Highlight) -->
  <rect x="950" y="385" width="190" height="140" rx="8" class="box-cyan" stroke-width="3"/>
  <text x="1045" y="415" text-anchor="middle" class="box-text" font-weight="700">✓ Selected</text>
  <text x="1045" y="435" text-anchor="middle" class="box-text">WordPiece-uncased</text>
  <text x="1045" y="457" text-anchor="middle" class="box-detail">Fertility: 1.727</text>
  <text x="1045" y="472" text-anchor="middle" class="box-detail">Suffix atomicity: 100%</text>
  <text x="1045" y="487" text-anchor="middle" class="box-detail">UNK rate: 0.0053%</text>

  <!-- Arrow to selected -->
  <path d="M 900 455 L 950 455" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Footer -->
  <text x="600" y="535" text-anchor="middle" class="box-detail" font-size="11">All metrics evaluated on 47,934 Azerbaijani documents. WordPiece-uncased selected for AzBERT pretraining.</text>
</svg>
