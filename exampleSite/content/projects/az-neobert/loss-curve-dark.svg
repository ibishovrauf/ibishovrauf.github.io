<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <style>
    .title { font-size: 16px; font-weight: 700; fill: #f1f5f9; }
    .sub   { font-size: 12px; fill: #94a3b8; }
    .tick  { font-size: 11px; fill: #94a3b8; }
    .pt    { font-size: 11px; font-weight: 700; fill: #e2e8f0; }
    .ar    { font-size: 11px; fill: #fca5a5; font-style: italic; }
    .ap    { font-size: 11px; fill: #c4b5fd; font-style: italic; }
    .ag    { font-size: 11px; fill: #94a3b8; font-style: italic; }
    .axis  { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .grid  { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
  </style>

  <rect x="0" y="0" width="760" height="430" rx="12" fill="#0d1117"/>

  <text x="380" y="30" text-anchor="middle" class="title">AzNEOBERT Training Loss · Phase 1</text>
  <text x="380" y="50" text-anchor="middle" class="sub">8× H200 · global batch 2,304 · seq len 1,024 · bf16 · DeepSpeed ZeRO-2</text>

  <line x1="80" y1="80"  x2="80"  y2="330" class="axis"/>
  <line x1="80" y1="330" x2="720" y2="330" class="axis"/>

  <line x1="80" y1="288" x2="720" y2="288" class="grid"/>
  <line x1="80" y1="247" x2="720" y2="247" class="grid"/>
  <line x1="80" y1="205" x2="720" y2="205" class="grid"/>
  <line x1="80" y1="163" x2="720" y2="163" class="grid"/>
  <line x1="80" y1="122" x2="720" y2="122" class="grid"/>
  <line x1="80" y1="80"  x2="720" y2="80"  class="grid"/>

  <text x="72" y="334" text-anchor="end" class="tick">0</text>
  <text x="72" y="292" text-anchor="end" class="tick">2</text>
  <text x="72" y="251" text-anchor="end" class="tick">4</text>
  <text x="72" y="209" text-anchor="end" class="tick">6</text>
  <text x="72" y="167" text-anchor="end" class="tick">8</text>
  <text x="72" y="126" text-anchor="end" class="tick">10</text>
  <text x="72" y="84"  text-anchor="end" class="tick">12</text>
  <text x="32" y="208" text-anchor="middle" class="sub" transform="rotate(-90 32 208)">MLM loss</text>

  <text x="80"  y="350" text-anchor="middle" class="tick">0</text>
  <text x="222" y="350" text-anchor="middle" class="tick">1,000</text>
  <text x="364" y="350" text-anchor="middle" class="tick">2,000</text>
  <text x="506" y="350" text-anchor="middle" class="tick">3,000</text>
  <text x="649" y="350" text-anchor="middle" class="tick">4,000</text>
  <line x1="667" y1="328" x2="667" y2="333" class="axis"/>
  <text x="667" y="362" text-anchor="middle" class="tick" font-size="9">4,131</text>
  <text x="380" y="380" text-anchor="middle" class="sub">optimizer step</text>

  <line x1="80" y1="99" x2="720" y2="99" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.8"/>
  <text x="718" y="93" text-anchor="end" class="ar">ln(64,000) ≈ 11.07 — random init baseline</text>

  <line x1="429" y1="80" x2="429" y2="330" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.8"/>
  <text x="424" y="76" text-anchor="end" class="ap">warmup complete — step 2,456 · lr = 1×10⁻⁴</text>

  <path d="M 80 99 C 96 100, 102 145, 108 164 S 350 230, 429 245 S 600 270, 667 281"
        fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="80"  cy="99"  r="5" fill="#f87171"/>
  <circle cx="108" cy="164" r="5" fill="#fcd34d"/>
  <circle cx="429" cy="245" r="5" fill="#c4b5fd"/>
  <circle cx="667" cy="281" r="5" fill="#86efac"/>

  <text x="93"  y="93"  class="pt">11.10</text>
  <text x="121" y="158" class="pt">7.95  (step 200)</text>
  <text x="441" y="239" class="pt">4.06  (step 2,456)</text>
  <text x="658" y="274" text-anchor="end" class="pt">2.35  (step 4,131)</text>

  <text x="380" y="408" text-anchor="middle" class="ag">~1.24M tokens/sec · 1.68 s/step · loss 11.10 → 2.35 in 3% of total training</text>
</svg>
