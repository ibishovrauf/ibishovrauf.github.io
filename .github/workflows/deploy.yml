# ─────────────────────────────────────────────────────────────────────────────
# Hugo → GitHub Pages deployment
#
# Repo layout (monorepo):
#   /                  ← Hugo theme source (hugo-profile)
#   exampleSite/       ← Your portfolio site
#   exampleSite/themes/hugo-profile → resolved at build time via --themesDir ../..
#
# Required repo settings (one-time, done in GitHub UI):
#   Settings → Pages → Source → "GitHub Actions"
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:          # allow manual trigger from Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; in-progress run is NOT cancelled
# so a concurrent push doesn't leave the site in a half-deployed state.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.149.1"    # pin to the version you tested locally

jobs:
  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # required for .GitInfo / lastmod to work correctly

      - name: Install Hugo Extended
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Verify Hugo extended
        run: hugo version   # confirms "extended" is in the output

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        # Outputs: base_url (e.g. https://ibishovrauf.github.io or https://yourdomain.com)
        # For custom domains this equals your CNAME value.
        # For project pages (non-root) it appends the repo name — handled automatically.

      - name: Build site
        run: |
          cd exampleSite
          hugo \
            --themesDir ../.. \
            --minify \
            --gc \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
        env:
          HUGO_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: exampleSite/public

  # ── Deploy ─────────────────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
